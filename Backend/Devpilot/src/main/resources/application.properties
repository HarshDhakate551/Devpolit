spring.application.name=Devpilot

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# GPT FOR ERROR DETECTION
server.error.include-stacktrace=always
logging.level.Backend.Devpilot=DEBUG
logging.level.org.springframework.web=DEBUG
server.max-http-request-header-size=64KB
#logging.level.reactor.netty.http.client=DEBUG
#logging.level.org.springframework.web.reactive.function.client=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.ai=DEBUG
spring.mvc.async.request-timeout=300000


# Chat
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.project-id=602312904107
# Embeddings (needs its own key)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

spring.security.user.name=user
spring.security.user.password=password123

# GITHUB OAUTH2
# client-id helps identify individaul applciation for the github so gihtub knows which register app is asking for oauth permission
#${...:...} syntax means Spring will look for an environment variable named GITHUB_CLIENT_ID; if it isn't found, it falls back to the default string provided (Ov23li4JuvBENseqVkcn)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
#Once the user grants permission, your backend server uses this secret along with an authorization code to prove to GitHub's servers that it is legitimately your app trying to securely exchange code for an access token.
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
#This lets you read user's profile data and give access to all the repo be it private or public
spring.security.oauth2.client.registration.github.scope=read:user,repo
#Tells Spring Security which field in the JSON response from GitHub's user API should be used as the primary unique identifier (name in the OAuth2 user principal). Setting this to id (GitHub's numeric user ID) is safer than using their username (login), since usernames can change over time while IDs never do.
spring.security.oauth2.client.provider.github.user-name-attribute=id

# PG VECTOR
#Tells spring ai to automatically create vector table as well as enable vector extension in Postgresql when application starts up
spring.ai.vectorstore.pgvector.initialize-schema=true
# This is the dimensions of vector embeding 
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# -----------------------------------

# Changes the name of cookie send by server from "JSESSIONID" to "DEVPILOT_SESSION" making it unique
server.servlet.session.cookie.name=DEVPILOT_SESSION
# Its an security feature so that the cookie cant be accessed via document.cookie type methods
server.servlet.session.cookie.http-only=true
# Prevents cross site forgery buy only sending cookie when the event was of click from safer site and not from any suspisious site
#Controls when the cookie is sent during cross-site requests. lax means the cookie will be sent with safe top-level navigations (like clicking a link to your site from somewhere else), but not with cross-site sub-requests (like an image or an iframe loaded from a malicious site)
server.servlet.session.cookie.same-site=lax
# Sets the user's session expiration time to 7 days
server.servlet.session.timeout=7d

#APP SETTING
# Declaration of url where frontend would exists
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Enabling cors for the frontend site so that information can be shared between ports i.e; making spring boot aware of which can make api requestes
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
# An server's statefull password for token encryption before saving it to database
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:PasswordOfDevPilotAnyValue}
# An server's statefull salt for token  before saving to database
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:4f9c3a812b7e6f0a9d1c3b5e7f2a4c68}
app.indexing.max-file-bytes=102400
#sets the size of large texts and paras to the chuck of 800 character for RAG
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
# Keeps an 50ms api delay gap between githubapi calls
app.github.api-delay-ms=50
#Keep an 600ms delay between ai api calls
app.ai.embedding-delay-ms=600
